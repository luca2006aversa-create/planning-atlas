<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17302a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo2.svg" type="image/svg+xml">
<link rel="icon" href="logo2-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="logo2-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<title>Planning Workshop Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
/* Mise en page : en-tête vert « volet », onglets en bas sur téléphone et en haut sur ordinateur,
   bouton + flottant selon la vue ; jaune des façades de Hanoï pour l'action et « aujourd'hui » */
:root{
  --bg:#eef1ec; --surface:#ffffff; --sunk:#e4e9e3; --ink:#17302a; --muted:#5b6d66; --line:#d3dcd5;
  --deep:#17302a; --on-deep:#eef1ec; --on-deep-muted:#a9bdb4;
  --jaune:#f2b705; --on-jaune:#17302a;
  --t-terrain:#2f7a4f; --t-atelier:#2d6a9f; --t-rendu:#c43d2b; --t-reunion:#7b4fa6; --t-autre:#6d7b75;
  --s-afaire:#6d7b75; --s-encours:#2d6a9f; --s-fait:#2f7a4f; --alerte:#c43d2b;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a17; --surface:#17241f; --sunk:#1d2c27; --ink:#e6eee8; --muted:#94a79f; --line:#2a3b35;
  --deep:#0a1310; --on-deep:#e6eee8; --on-deep-muted:#8fa49b;
  --jaune:#f5c542; --on-jaune:#17302a;
  --t-terrain:#5fbf86; --t-atelier:#72aade; --t-rendu:#ef7a64; --t-reunion:#b38de0; --t-autre:#9aa8a2;
  --s-afaire:#9aa8a2; --s-encours:#72aade; --s-fait:#5fbf86; --alerte:#ef7a64; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a17; --surface:#17241f; --sunk:#1d2c27; --ink:#e6eee8; --muted:#94a79f; --line:#2a3b35;
  --deep:#0a1310; --on-deep:#e6eee8; --on-deep-muted:#8fa49b;
  --jaune:#f5c542; --on-jaune:#17302a;
  --t-terrain:#5fbf86; --t-atelier:#72aade; --t-rendu:#ef7a64; --t-reunion:#b38de0; --t-autre:#9aa8a2;
  --s-afaire:#9aa8a2; --s-encours:#72aade; --s-fait:#5fbf86; --alerte:#ef7a64; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
#vue{display:grid;gap:16px;min-width:0}
.mobile-sem{display:grid;gap:12px}
.duo.trois{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--jaune);outline-offset:2px}
svg{flex:none}

/* en-tête */
header{background:var(--deep);color:var(--on-deep);position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.entete{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:60px;padding-block:8px}
.marque{display:flex;flex-direction:column;line-height:1.05;margin-right:auto;min-width:0}
.marque b{font:700 1.45rem var(--display);letter-spacing:.02em;text-transform:uppercase}
.marque b span{color:var(--jaune)}
.marque small{color:var(--on-deep-muted);font-size:.78rem}
.etat{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--on-deep-muted);white-space:nowrap}
.etat i{width:8px;height:8px;border-radius:50%;background:var(--on-deep-muted)}
.etat.ok i{background:#5fbf86;box-shadow:0 0 0 3px rgba(95,191,134,.25)}
.onglets{display:flex;gap:2px}
.onglets button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--on-deep-muted);font-weight:700;font-size:.9rem;padding:9px 12px;border-radius:10px}
.onglets button[aria-current="page"]{background:var(--jaune);color:var(--on-jaune)}
.onglets button:not([aria-current="page"]):hover{color:var(--on-deep)}
@media (max-width:899px){
  .entete .onglets{display:none}
  nav.bas{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.bas .onglets{justify-content:space-around;height:var(--nav-h)}
  nav.bas .onglets button{flex:1;flex-direction:column;gap:2px;font-size:.68rem;color:var(--muted);border-radius:0;padding:8px 2px}
  nav.bas .onglets button[aria-current="page"]{background:transparent;color:var(--ink)}
  nav.bas .onglets button[aria-current="page"] svg{background:var(--jaune);color:var(--on-jaune);border-radius:999px;padding:3px 14px;width:52px;height:28px}
  main{padding-bottom:calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))!important}
}
@media (min-width:900px){nav.bas{display:none}}

/* page */
main{max-width:1240px;margin:0 auto;padding-block:20px 110px;display:grid;gap:16px}
.tete{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
h1{font:700 clamp(1.7rem,5vw,2.4rem)/1 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
h1 small{display:block;font:500 .85rem var(--body);text-transform:none;color:var(--muted);letter-spacing:0;margin-top:4px}
h2{font:700 .8rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bandeau{background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.bandeau::before{content:"";flex:none;width:10px;height:10px;margin-top:6px;border-radius:50%;background:var(--jaune)}
.outils{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.recherche{position:relative;flex:1 1 220px;max-width:320px}
.recherche input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px 8px 36px}
.recherche svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.puces{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.puces button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:6px}
.puces button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pastille{width:9px;height:9px;border-radius:3px;background:var(--c,var(--t-autre));flex:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.btn.jaune{background:var(--jaune);border-color:var(--jaune);color:var(--on-jaune)}
.btn.rouge{color:var(--alerte);border-color:currentColor;background:transparent}
.btn.ico{padding:8px;border-radius:50%}
.vide{color:var(--muted);font-size:.88rem;margin:0;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.vide button{margin-top:8px}

/* créneaux */
.creneau{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.creneau:hover{border-color:var(--muted)}
.creneau .heure{grid-row:span 4;font:700 1.05rem/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--c);min-width:44px;display:flex;flex-direction:column}
.creneau .heure small{font-size:.8rem;color:var(--muted);font-weight:600}
.creneau .titre{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.creneau .meta{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:2px 10px}
.creneau .meta span{display:inline-flex;gap:4px;align-items:center}
.creneau .type{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--c);display:flex;gap:6px;align-items:center}
.creneau,.tache{position:relative}
.creneau .signe{grid-column:2}
.creneau.passe{opacity:.55}
.creneau.encours{border-color:var(--jaune);box-shadow:0 0 0 2px var(--jaune)}
.badge{font-size:.7rem;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--jaune);color:var(--on-jaune);text-transform:none;letter-spacing:0}
.liste{display:grid;gap:8px}

/* semaine */
.bande{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.bande button{border:0;background:transparent;border-radius:10px;padding:6px 0;display:grid;justify-items:center;gap:1px}
.bande button b{font:700 1.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.bande button small{font-size:.66rem;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.05em}
.bande button i{width:5px;height:5px;border-radius:50%;background:transparent}
.bande button.a i{background:var(--muted)}
.bande button.auj b{color:var(--alerte)}
.bande button[aria-pressed="true"]{background:var(--jaune);color:var(--on-jaune)}
.bande button[aria-pressed="true"] small,.bande button[aria-pressed="true"] b{color:var(--on-jaune)}
.bande button[aria-pressed="true"] i{background:var(--on-jaune)}
.sept{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.col7{display:grid;gap:6px;min-width:0}
.col7 .j{display:flex;align-items:baseline;gap:6px;padding:4px 2px 6px;border-bottom:2px solid var(--line)}
.col7 .j b{font:700 1.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.col7 .j small{font-size:.72rem;text-transform:uppercase;font-weight:700;color:var(--muted);letter-spacing:.06em}
.col7.auj .j{border-color:var(--jaune)}
.col7.auj .j b{color:var(--alerte)}
.col7 .creneau{grid-template-columns:1fr;padding:8px 9px}
.col7 .creneau .heure{grid-row:auto;flex-direction:row;gap:4px;font-size:.92rem;min-width:0}
.col7 .creneau .heure small{font-size:.92rem}
.ajout{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:6px;color:var(--muted);font-size:.8rem;opacity:.7}
.ajout:hover{opacity:1;color:var(--ink)}
@media (max-width:899px){.sept{display:none}}
@media (min-width:900px){.mobile-sem{display:none}}

/* tâches */
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 8px;font-weight:700;font-size:.82rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (min-width:900px){.seg.taches{display:none}}
.colonnes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:899px){.colonnes{grid-template-columns:1fr}.colonnes .col:not(.sel){display:none}.colonnes .col h2{display:none}}
.col{display:grid;gap:8px;min-width:0}
.col h2 span.n{background:var(--sunk);border-radius:999px;padding:0 8px;color:var(--ink);font-family:var(--body);letter-spacing:0}
.tache{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tache .rond{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);background:transparent;display:grid;place-items:center;color:var(--surface);padding:0;margin-top:1px}
.tache .rond.encours{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.tache .rond.fait{background:var(--c)}
.tache .corps{border:0;background:transparent;padding:0;text-align:left;display:grid;gap:3px;min-width:0}
.tache .titre{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.tache.fait .titre{text-decoration:line-through;color:var(--muted)}
.tache .meta{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.retard{color:var(--alerte);font-weight:700}
.etiquette{font-size:.72rem;font-weight:700;background:var(--sunk);border-radius:6px;padding:0 6px;color:var(--ink)}

/* mur */
.mur{columns:280px;column-gap:12px}
.post{break-inside:avoid;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:block;width:100%;text-align:left;padding:0}
.post:hover{border-color:var(--muted)}
.post img{display:block;width:100%;height:auto;background:var(--sunk)}
.post .c{padding:10px 12px 12px;display:grid;gap:6px}
.post p,.texte{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.post .pied{font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.epingle{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;color:var(--on-jaune);background:var(--jaune);border-radius:999px;padding:1px 8px;justify-self:start}

/* aujourd'hui */
.grille{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:899px){.grille{grid-template-columns:1fr}}
.pile{display:grid;gap:18px;min-width:0}
.section{display:grid;gap:8px;min-width:0}

/* consignes */
.feuille{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,4vw,28px);display:grid;gap:12px}
.texte{max-width:68ch;line-height:1.7}
.qui{font-size:.78rem;color:var(--muted)}

/* bouton + */
.fab{position:fixed;z-index:9;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:18px;background:var(--jaune);color:var(--on-jaune);font-weight:800;padding:14px 18px;display:flex;align-items:center;gap:8px;
  box-shadow:0 6px 18px rgba(15,26,23,.28)}
@media (max-width:899px){.fab{bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px))}}

/* fenêtre d'édition : feuille du bas sur téléphone */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:18px;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,19,16,.55)}
@media (max-width:599px){dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:92dvh}
  dialog form{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))!important}}
dialog form{display:grid;gap:14px;padding:20px max(18px,env(safe-area-inset-left,0px)) 18px max(18px,env(safe-area-inset-right,0px))}
dialog h3{font:700 1.5rem/1 var(--display);text-transform:uppercase;margin:0}
.champ{display:grid;gap:5px;min-width:0}
.champ>label,.champ>span.l{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.champ input:not([type=checkbox]):not([type=radio]):not([type=file]),.champ select,.champ textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.champ textarea{resize:vertical}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.choix{display:flex;flex-wrap:wrap;gap:6px}
.choix label{position:relative}
.choix input{position:absolute;opacity:0;pointer-events:none}
.choix label>span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:500;cursor:pointer}
.choix input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.choix input:focus-visible+span{outline:3px solid var(--jaune);outline-offset:2px}
.case{display:flex;gap:10px;align-items:center;font-weight:500}
.case input{width:20px;height:20px;accent-color:var(--ink)}
.depot{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;justify-items:start}
.apercu{max-height:200px;border-radius:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.actions .g{display:flex;gap:8px;margin-left:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;font-weight:500;max-width:calc(100vw - 32px)}
@media (max-width:899px){#toast{bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px))}}
/* identifiant */
.moi{border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--on-deep);border-radius:999px;padding:5px 11px;font-weight:700;font-size:.82rem;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.moi i{width:10px;height:10px;border-radius:50%;background:var(--jaune)}
.sites{max-width:1240px;margin:0 auto;display:flex;gap:6px;padding-block:0 10px}
.sites button{flex:1;border:1px solid rgba(255,255,255,.22);background:transparent;color:var(--on-deep-muted);border-radius:999px;padding:7px 12px;font-weight:700;font-size:.88rem;display:flex;gap:8px;align-items:center;justify-content:center;min-width:0}
.sites button small{font-weight:500;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sites button[aria-pressed="true"]{background:var(--on-deep);color:var(--deep);border-color:var(--on-deep)}
@media (min-width:900px){.sites{max-width:520px;margin:0 0 0 auto}}
@media (max-width:599px){.sites button small{display:none}}
.mob{display:none!important}
.marque b{white-space:nowrap}
.logo{width:34px;height:34px;border-radius:9px;flex:none}
@media (max-width:440px){.marque{display:none}.logo{margin-right:auto}}
.moi span{max-width:12ch;overflow:hidden;text-overflow:ellipsis}
@media (max-width:899px){.marque small{display:none}.moi span{max-width:7ch}.entete{gap:8px}}
@media (max-width:899px){.mob{display:inline-flex!important}.entete .etat span{display:none}}

/* carte */
.barre-carte{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.barre-carte .seg{flex:0 1 auto}
.nuance{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0}
.nuance[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.fichier{position:relative;overflow:hidden}
.fichier input{position:absolute;inset:0;opacity:0;cursor:pointer}
.carte-zone{position:relative;overflow:hidden;height:calc(100dvh - 300px);min-height:360px;border-radius:var(--r);border:1px solid var(--line);background:#f1f2f5;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.carte-zone.dessin,.carte-zone.lieu{cursor:crosshair}
@media (max-width:899px){.carte-zone{height:calc(100dvh - 330px - var(--nav-h))}}
#plan{position:absolute;left:0;top:0;transform-origin:0 0}
#plan img{max-width:none;display:block;pointer-events:none}
#plan svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.hit{pointer-events:none}
.hit.tr{pointer-events:stroke;cursor:pointer}
.carte-zone.gomme .hit.de{pointer-events:stroke;cursor:not-allowed}
#marques{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:transparent;padding:0}
.pin.lieu{display:flex;align-items:center;gap:6px;margin:-8px 0 0 -8px}
.pin.lieu i{width:16px;height:16px;background:var(--jaune);border:2px solid #17302a;transform:rotate(45deg);flex:none}
.pin.lieu span{background:var(--surface);color:var(--ink);border-radius:6px;padding:1px 6px;font-size:.75rem;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}
.pin.photo{width:44px;height:44px;margin:-22px 0 0 -22px}
.pin.photo .cone{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from -30deg,rgba(242,183,5,.8) 0 60deg,transparent 60deg)}
.pin.photo b{position:absolute;left:14px;top:14px;width:16px;height:16px;border-radius:50%;background:#17302a;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:1000}
.pin-l{background:none;border:0}
.leaflet-container{font:inherit;background:var(--sunk)}
.carte-zone.dessin{cursor:crosshair}
.zoom .btn{box-shadow:0 1px 4px rgba(0,0,0,.2)}
.galerie{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.galerie img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--sunk)}

/* questionnaire */
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.q .n{font:700 1.3rem/1 var(--display);color:var(--muted);min-width:22px}
.q .fl{display:flex;gap:4px}
.q .fl button{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;padding:0;display:grid;place-items:center}
.compo{background:var(--surface);border:2px solid var(--jaune);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.compo textarea,.feuille textarea,.feuille input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;margin:0;min-width:0}
legend{font-weight:700;padding:0 6px}
.lien{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.85rem}
.lien code{overflow-wrap:anywhere;flex:1 1 220px}
.res{display:grid;grid-template-columns:64px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:.85rem}
.jauge{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--c)}
.citation{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){
  .creneau,.post,.tache{transition:border-color .15s}
  dialog[open]{animation:monte .18s ease-out}
  @keyframes monte{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
}

<script>
const TYPES={terrain:"Terrain",atelier:"Atelier",rendu:"Rendu",reunion:"Réunion",autre:"Autre"};
const STATUTS={afaire:"À faire",encours:"En cours",fait:"Fait"};
const ORDRE=["afaire","encours","fait"];
const ONGLETS=[["auj","Aujourd'hui","Jour","i-auj"],["semaine","Semaine","Semaine","i-sem"],["taches","Tâches","Tâches","i-tac"],["carte","Carte","Carte","i-carte"],["mur","Mur","Mur","i-mur"],["questionnaire","Questionnaire","Enquête","i-q"],["consignes","Consignes",null,"i-con"]];
const FAB={auj:"Créneau",semaine:"Créneau",taches:"Tâche",mur:"Note ou photo",consignes:"Modifier"};
const QTYPES={fermee:"Fermée : oui / non / autre",ouverte:"Ouverte : réponse écrite"};
const COULEURS=["#c43d2b","#f2b705","#2f7a4f","#2d6a9f","#7b4fa6","#17302a"];
const LIEN_Q=location.origin+location.pathname+"#questionnaire";
/* fond de carte : rendu OSM de SiteScope, projection équirectangulaire (comme presentations/moteur/carte.js) */

const FORMS={
  creneaux:{nom:"Créneau",champs:[
    ["titre","Quoi","text",1,null,"ex. Relevé des berges, station 3"],["type","Type","choix",0,TYPES],
    ["date","Jour","date",1],["debut","Début","time"],["fin","Fin","time"],
    ["lieu","Lieu","text",0,null,"ex. Bãi Giữa, rive nord"],["qui","Qui","text",0,null,"Noms séparés par des virgules, ou « tous »"],
    ["consignes","Consignes et matériel","textarea",0,null,"Rendez-vous, matériel à prendre, ce qu'on doit rapporter…"]]},
  taches:{nom:"Tâche",champs:[
    ["titre","Tâche","text",1],["statut","Statut","choix",0,STATUTS],["responsable","Responsable","text"],
    ["echeance","Échéance","date"],["theme","Thème ou groupe","text",0,null,"ex. BG1, TS3, commun"],["detail","Détail","textarea"]]},
  mur:{nom:"Note ou photo",champs:[
    ["photo","Photo","photo"],["texte","Description","textarea",0,null,"Ce qu'on voit, ce qu'on a observé…"],["lieu","Lieu associé","lieu"],["theme","Thème","text"],["epingle","Épingler sur « Aujourd'hui »","checkbox"]]},
  lieux:{nom:"Lieu",champs:[["nom","Nom du lieu","text",1,null,"ex. Rampe du marché"],["note","Notes sur ce lieu","textarea",0,null,"Ambiance, usages, ce qui change selon l'heure ou le niveau de l'eau…"]]},
  traces:{nom:"Trajet",champs:[["nom","Nom du trajet","text",1]]},
  questions:{nom:"Question",champs:[["texte","Question","textarea",1],["type","Type","choix",0,QTYPES]]},
  membres:{nom:"Identifiant",champs:[["pseudo","Ton prénom ou identifiant","text",1,null,"ex. Luca"]]},
  consignes:{nom:"Consignes communes",champs:[["texte","Consignes","textarea",0,null,"Nommage des fichiers, sources, légendes, éthique des entretiens…"]]}
};
const SITES={
  hanoi:{nom:"Hanoï",lieu:"Bãi Giữa, fleuve Rouge",groupes:"BG1 à BG4",centre:[21.053,105.857],zoom:14},
  tasung:{nom:"Tà Sung",lieu:"Khau Phạ, montagnes du nord",groupes:"TS1 à TS5",centre:[21.77,104.30],zoom:13}
};
const R={};
const consId=()=>S.site==="hanoi"?"texte":S.site;
const siteDe=d=>d.site||"hanoi";
const reglageSite=()=>(R.sites||[]).find(d=>d.id===S.site)||{};
const siteCentre=()=>{const r=reglageSite();return r.lat!=null?[r.lat,r.lon]:SITES[S.site].centre};
const siteZoom=()=>reglageSite().zoom||SITES[S.site].zoom;
function appliquerSite(){
  for(const col of COLS)S[col]=col==="membres"?(R.membres||[]):(R[col]||[]).filter(d=>siteDe(d)===S.site);
  S.consignes=(R.consignes||[]).find(d=>d.id===consId())||null;
}
function majSites(){
  $("#sites").innerHTML=Object.entries(SITES).map(([k,v])=>`<button data-site="${k}" aria-pressed="${S.site===k}">${v.nom}<small>${v.groupes}</small></button>`).join("");
  $("#sousTitre").textContent="Workshop S5 · "+SITES[S.site].lieu;
}
async function changerSite(k){
  if(!SITES[k]||k===S.site)return;
  S.site=k;S.jour=null;S.theme="";try{localStorage.setItem("site",k)}catch(e){}
  appliquerSite();if(carte)carte.setView(siteCentre(),siteZoom());render();
  if(db&&S.moi&&monPseudo())db.collection("membres").doc(S.moi).update({site:k}).catch(()=>{});
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-site]");if(b)changerSite(b.dataset.site);
  if(e.target.closest("[data-centrer-site]")&&carte&&db){const c=carte.getCenter();db.collection("sites").doc(S.site).set({lat:+c.lat.toFixed(5),lon:+c.lng.toFixed(5),zoom:carte.getZoom(),par:S.moi,maj:Date.now()}).then(()=>toast("Vue de départ de "+SITES[S.site].nom+" enregistrée")).catch(refus)}});
const COLS=["creneaux","taches","mur","lieux","traces","traits","questions","reponses","membres"];
const S={creneaux:[],taches:[],mur:[],lieux:[],traces:[],traits:[],questions:[],reponses:[],membres:[],consignes:null,
  moi:null,ecrire:true,vue:"auj",semaine:0,jour:null,type:"",statut:"afaire",theme:"",filtre:"",moiSeul:false,
  outil:"main",couleur:COULEURS[0],calques:{traits:true,traces:true,photos:true,lieux:true},qmode:"repondre",
  site:(()=>{try{return localStorage.getItem("site")||"hanoi"}catch(e){return "hanoi"}})(),seulQ:location.hash==="#questionnaire",identite:false};
let db=null,user=null,assets=null;

const $=s=>document.querySelector(s);
const ic=(id,w=18)=>`<svg width="${w}" height="${w}" aria-hidden="true"><use href="#${id}"/></svg>`;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const auj=()=>iso(new Date());
const plus=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const lundiDe=s=>plus(s,-((parse(s).getDay()+6)%7));
const fmt=(s,o)=>parse(s).toLocaleDateString("fr-FR",o);
const court=s=>fmt(s,{day:"numeric",month:"short"});
const quand=t=>t?new Date(t).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const minutes=h=>{if(!h)return null;const [a,b]=h.split(":").map(Number);return a*60+b};
const cherche=(o,...k)=>!S.filtre||k.some(x=>String(o[x]??"").toLowerCase().includes(S.filtre));
const parHeure=(a,b)=>(a.debut||"99").localeCompare(b.debut||"99");
const typeDe=c=>TYPES[c.type]?c.type:"autre";
const statutDe=t=>STATUTS[t.statut]?t.statut:"afaire";
const crea=o=>o.auteur||o.par;
const recent=o=>o.maj&&Date.now()-o.maj<864e5;
const pointNeuf=o=>recent(o)?`<span class="pt-neuf" title="Modifié ${esc(quand(o.maj))}" aria-label="Modifié récemment"></span>`:"";
const signe=o=>{const a=crea(o);if(!a)return"";return `<span class="signe">${ic("i-gens",12)} ${auteur({par:a})}${o.par&&o.par!==a?` · modifié par ${auteur(o)}`:""}</span>`};
const auteur=o=>o&&o.par?`<span data-uid="${esc(o.par)}">…</span>`:"quelqu'un";
const dans=m=>m<60?`dans ${m} min`:`dans ${Math.floor(m/60)} h${m%60?String(m%60).padStart(2,"0"):""}`;
const pseudoDe=id=>{const m=S.membres.find(x=>x.id===id);return m&&m.pseudo||""};
const monPseudo=()=>pseudoDe(S.moi);
const couleurDe=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return COULEURS[h%COULEURS.length]};
const cap8=c=>["N","NE","E","SE","S","SO","O","NO"][Math.round(((c%360)+360)%360/45)%8];
const nomLieu=id=>{const l=S.lieux.find(x=>x.id===id);return l?l.nom:""};
/* « moi » : mon identifiant apparaît dans « qui » / « responsable », ou le créneau est pour tous */
const estMoi=txt=>{const p=monPseudo().toLowerCase();const t=String(txt||"").toLowerCase();return !!p&&(t.split(/[,;\/]| et /).some(x=>x.trim()===p)||t.includes(p))};
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3200)}

/* ---------- cartes ---------- */
function carteCreneau(c,{etat=false}={}){
  const t=typeDe(c);let cls="",badge="";
  if(etat&&c.date===auj()){
    const n=new Date(),now=n.getHours()*60+n.getMinutes(),d=minutes(c.debut),f=minutes(c.fin)??(d!=null?d+60:null);
    if(d!=null&&f!=null&&now>=f)cls=" passe";
    else if(d!=null&&now>=d){cls=" encours";badge=`<span class="badge">En cours</span>`}
    else if(d!=null&&d-now<=180)badge=`<span class="badge">${dans(d-now)}</span>`;
  }
  return `<button class="creneau${cls}" style="--c:var(--t-${t})" data-ouvrir="creneaux" data-id="${esc(c.id)}">${pointNeuf(c)}
    <span class="heure">${esc(c.debut||"—")}${c.fin?`<small>${esc(c.fin)}</small>`:""}</span>
    <span class="type"><span class="pastille" style="--c:var(--t-${t})"></span>${TYPES[t]} ${badge}</span>
    <span class="titre">${esc(c.titre)}</span>
    ${c.lieu||c.qui?`<span class="meta">${c.lieu?`<span>${ic("i-lieu",13)}${esc(c.lieu)}</span>`:""}${c.qui?`<span>${ic("i-gens",13)}${esc(c.qui)}</span>`:""}</span>`:""}
    ${signe(c)}
  </button>`;
}
function carteTache(t){
  const st=statutDe(t),tard=t.echeance&&t.echeance<auj()&&st!=="fait";
  const suiv=ORDRE[(ORDRE.indexOf(st)+1)%3];
  return `<div class="tache ${st}" style="--c:var(--s-${st})">${pointNeuf(t)}
    <button class="rond ${st}" data-statut="${suiv}" data-id="${esc(t.id)}" aria-label="${STATUTS[st]} : passer à « ${STATUTS[suiv]} »" title="Passer à « ${STATUTS[suiv]} »">${st==="fait"?ic("i-ok",14):""}</button>
    <button class="corps" data-ouvrir="taches" data-id="${esc(t.id)}">
      <span class="titre">${esc(t.titre)}</span>
      <span class="meta">${t.theme?`<span class="etiquette">${esc(t.theme)}</span>`:""}${t.responsable?`<span>${esc(t.responsable)}</span>`:""}${t.echeance?`<span class="${tard?"retard":""}">${tard?"En retard · ":""}${esc(fmt(t.echeance,{weekday:"short",day:"numeric",month:"short"}))}</span>`:""}</span>
      ${signe(t)}
    </button>
  </div>`;
}
function post(m){
  const lieu=nomLieu(m.lieu);
  return `<button class="post" data-ouvrir="mur" data-id="${esc(m.id)}">
    ${m.photo?`<img src="${esc(photoUrl(m.photo))}" alt="${esc(m.texte||"Photo du groupe")}" loading="lazy">`:""}
    <span class="c">
      ${m.epingle?`<span class="epingle">${ic("i-pin",12)}Épinglé</span>`:""}
      ${m.texte?`<p>${esc(m.texte)}</p>`:""}

      ${S.ecrire&&db?`<div class="compo"><label for="qtexte" style="font-weight:700">Nouvelle question</label><textarea id="qtexte" rows="2" placeholder="ex. Depuis combien de temps habitez-vous sur le banc ?"></textarea>

async function nommer(racine){
  const els=[...racine.querySelectorAll("[data-uid]")];if(!els.length)return;
  const manque=[...new Set(els.map(e=>e.dataset.uid).filter(id=>!pseudoDe(id)))];
  const ps=manque.length&&user?await user.profiles(manque):{};
  els.forEach(e=>e.textContent=pseudoDe(e.dataset.uid)||(ps[e.dataset.uid]&&ps[e.dataset.uid].name)||"quelqu'un");
}
/* garde ce qu'on est en train d'écrire quand les données des autres arrivent */
function sauver(v){const a=document.activeElement;return {f:[...v.querySelectorAll("input[id],textarea[id]")].map(e=>[e.id,e.value,e.checked]),a:a&&v.contains(a)?a.id:null,s:a&&a.selectionStart}}
function restaurer(v,g){for(const [id,val,ch] of g.f){const e=document.getElementById(id);if(!e||!v.contains(e))continue;if(e.type==="radio"||e.type==="checkbox")e.checked=ch;else if(e.type!=="file")e.value=val}
  if(g.a){const e=document.getElementById(g.a);if(e){e.focus();try{if(g.s!=null)e.setSelectionRange(g.s,g.s)}catch(x){}}}}
function render(){
  majSites();
  if(S.seulQ)S.vue="questionnaire";
  const ong=S.seulQ?"":ONGLETS.map(([k,v,c,i])=>`<button data-vue="${k}" aria-current="${S.vue===k?"page":"false"}">${ic(i,20)}<span>${v}</span></button>`).join("");
  $("#ongletsHaut").innerHTML=ong;
  $("#ongletsBas").innerHTML=S.seulQ?"":ONGLETS.filter(o=>o[2]).map(([k,v,c,i])=>`<button data-vue="${k}" aria-current="${S.vue===k?"page":"false"}">${ic(i,20)}<span>${c}</span></button>`).join("");
  document.querySelector("nav.bas").hidden=S.seulQ;
  $("#outils").hidden=!["semaine","taches","mur"].includes(S.vue);
  const f=$("#fab");f.hidden=!S.ecrire||!db||!FAB[S.vue];f.querySelector("span").textContent=FAB[S.vue]||"";
  $("#pseudos").innerHTML=S.membres.map(m=>`<option value="${esc(m.pseudo)}">`).join("");
  const mb=$("#moiBtn");mb.hidden=!S.moi;mb.querySelector("span").textContent=monPseudo()||"Choisir mon identifiant";
  const v=$("#vue");
  if(S.vue==="tableau"){tbRendre();return}
  if(S.vue==="carte"){if(!$("#carte")){v.innerHTML=VUES.carte();initCarte()}majCarte();return}
  const g=sauver(v);v.innerHTML=VUES[S.vue]();restaurer(v,g);nommer(v);
}

/* ---------- carte mondiale (Leaflet + OpenStreetMap) : dessiner, lieux, photos, trajets ---------- */
let carte=null,couches={},traitEnCours=null,ligneEnCours=null;
const VUE_DEPART=[21.053,105.857];
const FONDS={
  "Plan":()=>L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}),
  "Relief":()=>L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{subdomains:"abc",maxZoom:17,attribution:"© OpenStreetMap, © OpenTopoMap (CC-BY-SA)"}),

const icone=(html)=>L.divIcon({className:"pin-l",html,iconSize:[0,0]});
function barreCarte(){

  return `<div class="seg" role="group" aria-label="Outil">${o("main","Déplacer")}${S.ecrire?o("dessin","Dessiner")+o("gomme","Gomme")+o("lieu","+ Lieu"):""}</div>

    ${typeof gpsBoutons==="function"?gpsBoutons():""}${S.ecrire?`<span class="btn fichier">Importer un trajet GPX<input type="file" id="gpx" accept=".gpx,application/gpx+xml" multiple aria-label="Importer un trajet GPX"></span>`:""}
    ${S.ecrire?`<button class="btn" data-centrer-site="1" title="Enregistre la vue actuelle comme vue de départ du site">Vue de départ du site ici</button>`:""}<div class="puces" role="group" aria-label="Calques">${[["traits","Dessins"],["traces","Trajets"],["photos","Photos"],["lieux","Lieux"]].map(([k,l])=>`<button data-calque="${k}" aria-pressed="${S.calques[k]}">${l}</button>`).join("")}</div>`;

const ll=pts=>{const r=[];for(let i=0;i<pts.length;i+=2)r.push([pts[i+1],pts[i]]);return r};
function majCarte(){
  if(!carte)return;
  $("#barreCarte").innerHTML=barreCarte();
  $("#carte").classList.remove("main","dessin","gomme","lieu");$("#carte").classList.add(S.outil);
  if(S.outil==="dessin")carte.dragging.disable();else carte.dragging.enable();
  for(const g of Object.values(couches))g.clearLayers();
  if(S.calques.traces)for(const t of S.traces)L.polyline(ll(t.pts||[]),{color:couleurDe(t.par),weight:5,opacity:.85}).on("click",()=>{if(S.outil==="main")ouvrir("traces",t.id)}).addTo(couches.traces);
  if(S.calques.traits)for(const t of S.traits)L.polyline(ll(t.pts||[]),{color:t.couleur||COULEURS[0],weight:+t.ep||3}).on("click",()=>{if(S.outil==="gomme")supprimerTrait(t.id)}).addTo(couches.traits);
  if(S.calques.photos)for(const p of S.mur.filter(x=>x.lat!=null&&x.lon!=null))
    L.marker([p.lat,p.lon],{icon:icone(`<span class="pin photo" title="${esc(p.texte||"Photo")}">${p.cap!=null?`<span class="cone" style="transform:rotate(${+p.cap}deg)"></span>`:""}<b></b></span>`)}).on("click",()=>ouvrir("mur",p.id)).addTo(couches.photos);
  if(S.calques.lieux)for(const l of S.lieux)if(l.lat!=null)

  if(typeof maPos!=="undefined"&&maPos)L.circleMarker([maPos.lat,maPos.lon],{radius:9,color:"#fff",weight:3,fillColor:"#2d6a9f",fillOpacity:1}).addTo(couches.moi);

function centrer(){
  const pts=[...S.lieux.filter(l=>l.lat!=null).map(l=>[l.lat,l.lon]),...S.mur.filter(m=>m.lat!=null).map(m=>[m.lat,m.lon])];
  if(pts.length>1)carte.fitBounds(pts,{padding:[40,40],maxZoom:16});else carte.setView(pts[0]||siteCentre(),pts.length?16:siteZoom());
}
function initCarte(){
  if(carte){carte.remove();carte=null}
  carte=L.map("carte",{zoomControl:false,tap:false});
  const fonds={};for(const [n,f] of Object.entries(FONDS))fonds[n]=f();
  let choix="Plan";try{choix=localStorage.getItem("fond")||"Plan"}catch(e){}
  (fonds[choix]||fonds.Plan).addTo(carte);
  const sitescope=L.imageOverlay(FOND_SITESCOPE.src,FOND_SITESCOPE.bornes,{opacity:.9});

async function importerGpx(files){
  for(const f of files){
    try{
      const x=new DOMParser().parseFromString(await f.text(),"application/xml");
      const brut=[...x.querySelectorAll("trkpt,rtept")].map(p=>[+p.getAttribute("lon"),+p.getAttribute("lat")]).filter(p=>isFinite(p[0])&&isFinite(p[1]));
      if(brut.length<2){toast(`${f.name} : aucun point de trajet trouvé.`);continue}
      const gard=[brut[0]];for(const p of brut){const q=gard[gard.length-1];if(Math.hypot((p[0]-q[0])*111320*Math.cos(p[1]*Math.PI/180),(p[1]-q[1])*110540)>4)gard.push(p)}
      const pas=Math.ceil(gard.length/8000),pts=[];gard.forEach((p,i)=>{if(i%pas===0)pts.push(Math.round(p[0]*1e5)/1e5,Math.round(p[1]*1e5)/1e5)});
      const t=[...x.querySelectorAll("time")].map(e=>e.textContent);
      await db.collection("traces").doc().set({nom:f.name.replace(/\.gpx$/i,""),pts,debut:t[0]||null,fin:t[t.length-1]||null,par:S.moi,cree:Date.now()});
      toast(`Trajet « ${f.name} » ajouté`);
    }catch(e){if(e&&e.code)refus(e);else toast(`${f.name} : fichier GPX illisible.`)}
  }
}

/* ---------- position et direction lues dans la photo (EXIF) ---------- */
async function lireExifBrut(file){
  try{
    const b=new DataView(await file.slice(0,262144).arrayBuffer());if(b.getUint16(0)!==0xFFD8)return null;
    let o=2;while(o<b.byteLength-10){const m=b.getUint16(o),l=b.getUint16(o+2);if(m===0xFFE1&&b.getUint32(o+4)===0x45786966)return tiff(b,o+10);if((m&0xFF00)!==0xFF00)break;o+=2+l}
  }catch(e){}
  return null;
}
function tiff(b,t){
  const le=b.getUint16(t)===0x4949,u16=p=>b.getUint16(p,le),u32=p=>b.getUint32(p,le),rat=p=>u32(p)/(u32(p+4)||1);
  const ifd=(p,f)=>{const n=u16(p);for(let i=0;i<n;i++){const e=p+2+i*12;f(u16(e),t+u32(e+8),e+8)}};
  const r={};let gps=0,ex=0;
  ifd(t+u32(t+4),(tag,off,v)=>{if(tag===0x8825)gps=u32(v);if(tag===0x8769)ex=u32(v)});
  const dms=p=>rat(p)+rat(p+8)/60+rat(p+16)/3600;
  if(gps)ifd(t+gps,(tag,off,v)=>{if(tag===1)r.ns=String.fromCharCode(b.getUint8(v));if(tag===3)r.eo=String.fromCharCode(b.getUint8(v));
    if(tag===2)r.lat=dms(off);if(tag===4)r.lon=dms(off);if(tag===17)r.cap=Math.round(rat(off))});
  if(ex)ifd(t+ex,(tag,off)=>{if(tag===0x9003){let s="";for(let i=0;i<19;i++)s+=String.fromCharCode(b.getUint8(off+i));r.prise=s}});
  const out={};
  if(r.lat!=null&&r.lon!=null&&(r.lat||r.lon)){out.lat=+(r.ns==="S"?-r.lat:r.lat).toFixed(6);out.lon=+(r.eo==="W"?-r.lon:r.lon).toFixed(6)}
  if(r.cap!=null&&isFinite(r.cap))out.cap=r.cap;if(r.prise)out.prise=r.prise;
  return out;
}

async function reduire(file){
  try{const b=await createImageBitmap(file),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement("canvas");
    c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    const r=await new Promise(res=>c.toBlob(res,"image/jpeg",.85));return r||file}catch(e){return file}
}
function refus(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){S.ecrire=false;info();render();toast("Modification refusée : demande au propriétaire de te passer « Éditeur ».")}
  else if(c==="quota_exceeded"||c==="quota_or_state")toast("Le stockage est plein : supprime d'anciennes notes ou photos.");
  else if(c==="too_large")toast("Fichier trop lourd.");
  else if(c==="unsupported_type")toast("Format d'image non accepté : utilise JPEG ou PNG.");
  else toast("Échec de l'enregistrement, réessaie dans un instant.");
}
